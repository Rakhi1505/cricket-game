<body>
    
<script>
    /*give discount based on age,gender for metro ticket 
    FEMALES GET50%
    KIDS UNDER 5 YEARS OF AGE ARE FREE
    KIDS UP TO 8 YEARS HAVE HALF ticket
    PEOPLE OVER 65 YEARS OF AGE ONLY PAY 30% OF THE ticket 
    IN CASE OF MULTIPLE DISCOUNT MAX DISCOUNT WILL APPLY*/ 
    let age=70;
    let gender='female';
    let ticketprice=100; 
    if(age<5){ ticketprice=(ticketprice-ticketprice*100/100);console.log('the price for your ticket is:'+ticketprice);}
    
    else if(age>=5 && age<=8){ticketprice=(ticketprice/2);console.log('the price for your ticket is:'+ticketprice);}
    else if(age>65){if(gender=='female'){ ticketprice=(ticketprice*50/100);console.log('the price for your ticket is:'+ticketprice);}
    else{ticketprice=(ticketprice-ticketprice*30/100);console.log ('the price for your ticket is'+ticketprice);}}
    else if(gender=='female'){ticketprice=ticketprice/2;console.log('the price for your ticket is:'+ticketprice);}
    else{console.log('the price for your ticket is'+ticketprice);}
</script>
</body>
</html>
